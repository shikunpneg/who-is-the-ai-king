name: Daily LLM Tracker Update

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:
  push:
    paths: ["data/companies.seed.json"]

# 关键：允许 workflow 写回仓库
permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm install --no-audit --prefer-offline --no-fund

      - name: Run daily cron
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run cron

      - name: Commit snapshot log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/snapshots.log.json || true
          if git diff --staged --quiet; then
            echo "No snapshot changes"
          else
            git commit -m "chore: daily snapshot $(date -u +%Y-%m-%d)"
            git push
          fi
