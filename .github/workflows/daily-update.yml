name: Daily LLM Tracker Update

on:
  schedule:
    # 每天 08:00 UTC（北京时间 16:00）跑一次
    - cron: "0 8 * * *"
  workflow_dispatch:        # 允许手动触发
  push:
    paths: ["data/companies.seed.json"]  # 改种子数据立即跑

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Run daily cron
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run cron

      - name: Commit snapshot log
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/snapshots.log.json || true
          git diff --staged --quiet || git commit -m "chore: daily snapshot $(date -u +%Y-%m-%d)"
          git push
